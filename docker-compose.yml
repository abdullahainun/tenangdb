services:
  tenangdb:
    image: ghcr.io/abdullahainun/tenangdb:latest
    # build:                            # uncomment for local builds
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tenangdb
    entrypoint: ["tenangdb"]
    command: ["version"]
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./backups:/backups
      - ./logs:/logs
      - ./metrics:/var/lib/tenangdb
    environment:
      - TZ=Asia/Jakarta

  tenangdb-exporter:
    image: ghcr.io/abdullahainun/tenangdb:latest
    # build:                            # uncomment for local builds
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tenangdb-exporter
    restart: unless-stopped
    entrypoint: ["tenangdb-exporter"]
    command: ["--port", "9090"]
    ports:
      - "9090:9090"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./metrics:/var/lib/tenangdb
      - ./logs:/logs
    environment:
      - TZ=Asia/Jakarta
      
