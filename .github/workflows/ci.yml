name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

jobs:
  test-matrix:
    name: Test Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
    
    - name: Tidy dependencies
      run: go mod tidy

    - name: Check tidy is clean
      run: git diff --exit-code go.mod go.sum

    - name: Get dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
    
    - name: Build main binary
      run: CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags '-extldflags "-static"' -v -o tenangdb ./cmd
    
    - name: Build exporter binary
      run: CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags '-extldflags "-static"' -v -o tenangdb-exporter ./cmd/tenangdb-exporter


  security-and-lint:
    name: Security & Lint
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.25-

    - name: Tidy dependencies
      run: go mod tidy

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run linting
      run: golangci-lint run --timeout=5m
    
    - name: Run security checks
      run: |
        echo "🔍 Running security checks..."
        
        # Check for hardcoded secrets
        if grep -r "password\|secret\|key" --include="*.go" . > /dev/null 2>&1; then
          echo "⚠️  Found potential hardcoded secrets"
          grep -r "password\|secret\|key" --include="*.go" . | head -3
        else
          echo "✅ No hardcoded secrets found"
        fi
        
        # Run vulnerability check
        echo "🔍 Running vulnerability scan..."
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
        
        echo "✅ Security checks completed"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-matrix]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image for testing
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: tenangdb:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test basic functionality
      run: |
        echo "🧪 Testing basic functionality with Docker..."
        
        # Test main binary version command
        docker run --rm tenangdb:test version
        
        # Test main binary help command
        docker run --rm tenangdb:test --help
        
        # Test backup command help
        docker run --rm tenangdb:test backup --help
        
        # Test exporter binary version command
        docker run --rm --entrypoint tenangdb-exporter tenangdb:test version
        
        # Test exporter binary help command
        docker run --rm --entrypoint tenangdb-exporter tenangdb:test --help
        
        # Test invalid config handling for main binary
        if docker run --rm tenangdb:test backup --config non-existent-config.yaml --dry-run 2>/dev/null; then
          echo "❌ Should fail with non-existent config"
          exit 1
        else
          echo "✅ Properly handles non-existent config"
        fi
        
        echo "✅ Integration tests completed successfully"
    
    - name: Test PostgreSQL backup and restore
      run: |
        echo "🧪 Testing PostgreSQL backup and restore..."
        
        # Use host network so containers can reach the postgres service via localhost
        
        # Create PG config (use localhost with --network host, or service name with custom network)
        cat > /tmp/pg-config.yaml << EOF
        database:
          type: postgresql
          host: localhost
          port: 5432
          username: testuser
          password: testpass
          timeout: 30
        backup:
          databases:
            - testdb
          directory: /backups
        logging:
          level: info
          format: clean
        metrics:
          enabled: false
        cleanup:
          enabled: false
        EOF
        
        mkdir -p /tmp/backups
        
        # Create test data in PostgreSQL
        docker run --rm --network host postgres:15 \
          psql -h localhost -U testuser -d testdb -c "CREATE TABLE ping (id serial PRIMARY KEY, ts timestamptz DEFAULT now()); INSERT INTO ping DEFAULT VALUES;"
        
        # Run backup via tenangdb Docker image
        docker run --rm --network host \
          -v /tmp/pg-config.yaml:/config.yaml:ro \
          -v /tmp/backups:/backups \
          tenangdb:test backup --config /config.yaml
        
        # Verify backup file exists
        BACKUP_FILE=$(find /tmp/backups -name '*.dump' 2>/dev/null | head -1)
        if [ -z "$BACKUP_FILE" ]; then
          echo "❌ No PostgreSQL backup file found"
          find /tmp/backups -type f 2>/dev/null
          exit 1
        fi
        echo "✅ PostgreSQL backup created: $BACKUP_FILE"
        
        # Create a fresh DB and restore
        docker run --rm --network host postgres:15 \
          psql -h localhost -U testuser -c "CREATE DATABASE restored_db;"
        
        docker run --rm --network host \
          -v /tmp/backups:/backups:ro \
          --entrypoint sh \
          tenangdb:test \
          -c "PGPASSWORD=testpass pg_restore -h localhost -U testuser -d restored_db --clean --if-exists /backups/$(basename $BACKUP_FILE)"
        
        # Verify restore
        RESULT=$(docker run --rm --network host postgres:15 \
          psql -h localhost -U testuser -d restored_db -A -t -c "SELECT COUNT(*) FROM ping;")
        if [ "$RESULT" != "1" ]; then
          echo "❌ Restore verification failed: expected 1 row, got $RESULT"
          exit 1
        fi
        echo "✅ PostgreSQL restore verified successfully"

  docker-build-amd64:
    name: Build and Push (amd64)
    runs-on: ubuntu-latest
    needs: [test-matrix, security-and-lint, integration-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        flavor: |
          suffix=-amd64,onlatest=true
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=TenangDB
          org.opencontainers.image.description=Backup yang Bikin Tenang - MySQL backup automation tool
          org.opencontainers.image.vendor=Ainun Abdullah
          org.opencontainers.image.licenses=MIT
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        provenance: false
        sbom: false
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          COMMIT_SHA=${{ github.sha }}

  docker-build-arm64:
    name: Build and Push (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [test-matrix, security-and-lint, integration-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        flavor: |
          suffix=-arm64,onlatest=true
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=TenangDB
          org.opencontainers.image.description=Backup yang Bikin Tenang - MySQL backup automation tool
          org.opencontainers.image.vendor=Ainun Abdullah
          org.opencontainers.image.licenses=MIT
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm64
        provenance: false
        sbom: false
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          COMMIT_SHA=${{ github.sha }}

  docker-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [docker-build-amd64, docker-build-arm64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract clean tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Create and push multi-arch manifest
      run: |
        echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[]' | while read TAG; do
          echo "Creating manifest for ${TAG}"
          docker buildx imagetools create \
            -t "${TAG}" \
            "${TAG}-amd64" \
            "${TAG}-arm64"
        done

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [test-matrix, security-and-lint, integration-test, docker-build-amd64, docker-build-arm64, docker-manifest]
    if: always()
    steps:
    - name: Check all jobs
      run: |
        if [ "${{ needs.test-matrix.result }}" != "success" ]; then
          echo "test-matrix failed: ${{ needs.test-matrix.result }}"
          exit 1
        fi
        if [ "${{ needs.security-and-lint.result }}" != "success" ]; then
          echo "security-and-lint failed: ${{ needs.security-and-lint.result }}"
          exit 1
        fi
        if [ "${{ needs.integration-test.result }}" != "success" ]; then
          echo "integration-test failed: ${{ needs.integration-test.result }}"
          exit 1
        fi
        if [ "${{ needs.docker-build-amd64.result }}" != "success" ] && [ "${{ needs.docker-build-amd64.result }}" != "skipped" ]; then
          echo "docker-build-amd64 failed: ${{ needs.docker-build-amd64.result }}"
          exit 1
        fi
        if [ "${{ needs.docker-build-arm64.result }}" != "success" ] && [ "${{ needs.docker-build-arm64.result }}" != "skipped" ]; then
          echo "docker-build-arm64 failed: ${{ needs.docker-build-arm64.result }}"
          exit 1
        fi
        if [ "${{ needs.docker-manifest.result }}" != "success" ] && [ "${{ needs.docker-manifest.result }}" != "skipped" ]; then
          echo "docker-manifest failed: ${{ needs.docker-manifest.result }}"
          exit 1
        fi
        echo "All CI checks passed successfully!"